<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FILM — แก้ไขเว็บไซต์</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0b;color:#eee;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;padding:24px;box-sizing:border-box}
    .box{max-width:520px;border:1px solid #2a2a2a;padding:36px;background:#111}
    h1{font-size:22px;margin:0 0 12px;letter-spacing:.04em}
    ol{line-height:1.9;color:#bbb;padding-left:20px}
    a.btn{display:inline-block;margin-top:16px;padding:14px 22px;border:1px solid #eee;color:#fff;text-decoration:none;letter-spacing:.12em}
    a.btn:hover{background:#fff;color:#000}
    .back{display:block;margin-top:20px;color:#888;font-size:14px}
  </style>
</head>
<body>
  <div class="box">
    <h1>แก้ไขเว็บไซต์ด้วย Pages CMS</h1>
    <ol>
      <li>กดปุ่มด้านล่างเพื่อเปิด Pages CMS</li>
      <li>Sign in with GitHub (บัญชี Filmweerayut)</li>
      <li>เลือกรีโป <b>film-portfolio</b></li>
      <li>แก้ไขผลงาน / ข้อความ แล้วกด <b>Save</b></li>
      <li>รอประมาณ 1 นาที เว็บจะอัปเดตเอง</li>
    </ol>
    <a class="btn" href="https://app.pagescms.org" rel="noopener">เปิด PAGES CMS →</a>
    <a class="back" href="../">← กลับไปหน้าเว็บ</a>
  </div>
</body>
</html>
